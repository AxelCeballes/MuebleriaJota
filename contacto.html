<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <title>Contacto | Hermanos Jota</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html" aria-label="Hermanos Jota - Inicio"><img src="img/logo.svg" alt="Hermanos Jota"></a>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="contacto.html">Contacto</a>
      <a class="cart-link" href="productos.html">Carrito <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <p class="eyebrow">HABLEMOS</p>
      <h1>Contacto</h1>
      <p>¿Tenés una consulta? Estamos para ayudarte.</p>
    </section>

    <section class="contact-section">
      <form id="contact-form" class="contact-form">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" required minlength="2">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="6" required minlength="10"></textarea>

        <button class="btn" type="submit">ENVIAR MENSAJE</button>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>

      <aside class="contact-info">
        <h2>Casa Taller</h2>
        <p>Av. San Juan 2847<br>San Cristóbal, CABA</p>
        <p>Lunes a viernes: 10:00–19:00<br>Sábados: 10:00–14:00</p>
        <p>info@hermanosjota.com.ar</p>
      </aside>
    </section>
  </main>

  <footer class="footer">
    <strong>HERMANOS JOTA</strong>
    <p>© 2026 Hermanos Jota. Todos los derechos reservados.</p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
