<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <title>Carrito | Hermanos Jota</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a class="logo" href="index.html" aria-label="Hermanos Jota - Inicio">
        <img src="img/logo.svg" alt="Hermanos Jota">
      </a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Catálogo</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
    <div class="header-right">
      <a class="cart-link" href="carrito.html" aria-label="Ver carrito de compras">
        <img src="img/logo-compras.png" alt="Carrito de compras" class="cart-icon">
        <span id="cart-count" class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <main>
    <section class="page-header">
      <p class="eyebrow">TU SELECCIÓN</p>
      <h1>Carrito</h1>
      <p>Revisá tus piezas antes de continuar.</p>
    </section>

    <section class="cart-section">
      <div id="cart-items" class="cart-list">
        <p>Cargando carrito...</p>
      </div>
      <aside class="cart-summary">
        <h2>Resumen</h2>
        <p class="cart-summary-row">
          <span>Unidades</span>
          <span id="cart-summary-count">0</span>
        </p>
        <p class="cart-summary-total">
          <span>Total</span>
          <span id="cart-total">$0</span>
        </p>
        <button id="cart-clear" class="btn-outline">VACIAR CARRITO</button>
        <p id="cart-message" class="form-message" aria-live="polite"></p>
      </aside>
    </section>
  </main>

  <footer class="footer">
    <strong>HERMANOS JOTA</strong>
    <p>Av. San Juan 2847 · San Cristóbal · CABA</p>
    <p>© 2026 Hermanos Jota</p>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
